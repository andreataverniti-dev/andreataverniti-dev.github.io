[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/demo/casale-taverniti/il-casale/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/demo/casale-taverniti/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/demo/casale-taverniti/immagini/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/casale-taverniti/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
